services:
  - type: web
    name: ecotrack-portal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: http://localhost:5173
      - key: DUPLICATE_THRESHOLD
        value: 60

